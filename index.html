<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Setlist</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --dim:#7a7a7a;
    --accent:#ffd23f;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-weight:800;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  body{min-height:100vh;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ===== MENU ===== */
  #menu{padding:calc(var(--safe-t) + 14px) calc(var(--safe-r) + 12px)
                calc(var(--safe-b) + 28px) calc(var(--safe-l) + 12px);}
  #menu h1{font-size:24px;letter-spacing:.5px;margin-bottom:4px;}
  #menu .sub{color:var(--dim);font-size:13px;font-weight:700;margin-bottom:16px;}
  .item{
    display:flex;align-items:center;gap:12px;
    width:100%;text-align:left;border:none;cursor:pointer;
    background:#111;color:var(--fg);
    border-radius:14px;
    padding:18px 16px;margin-bottom:10px;
    font-weight:800;
  }
  .item:active{background:#1d1d1d;}
  .item .n{
    flex:0 0 auto;min-width:30px;height:30px;line-height:30px;text-align:center;
    background:var(--accent);color:#000;border-radius:8px;font-size:15px;padding:0 6px;
  }
  .item .t{flex:1;font-size:21px;line-height:1.15;}
  .item .bpm{flex:0 0 auto;color:var(--dim);font-size:13px;font-weight:700;}
  .item.instru .t{color:var(--dim);}
  .item.hu .n{background:#3ddc84;}
  .item.en .n{background:#4aa3ff;}
  .item.turc .n{background:#ff4d4d;color:#fff;}
  .item.instru .n{background:#444;color:#aaa;}

  /* ===== SONG ===== */
  #song{padding-bottom:calc(var(--safe-b) + 96px);}
  .topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(0,0,0,.92);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
    border-bottom:1px solid #1c1c1c;
    display:flex;align-items:center;gap:12px;
  }
  .backbtn{
    flex:0 0 auto;background:var(--accent);color:#000;border:none;cursor:pointer;
    border-radius:10px;padding:10px 16px;font-size:17px;font-weight:800;
  }
  .backbtn:active{opacity:.7;}
  .songhdr{flex:1;min-width:0;}
  .songhdr .st{font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .songhdr .sn{color:var(--dim);font-size:12px;font-weight:700;}
  .lyrics{
    padding:22px calc(var(--safe-r) + 16px) 22px calc(var(--safe-l) + 16px);
    font-size:30px;line-height:1.32;letter-spacing:.2px;
  }
  .lyrics .ln{margin:0;}
  .lyrics .blank{height:18px;}
  .lyrics .marker{color:var(--accent);font-size:22px;}
  .instru-note{
    padding:60px 24px;text-align:center;color:var(--dim);font-size:26px;line-height:1.4;
  }

  /* size controls */
  .sizebar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;gap:10px;
    padding:10px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);
    background:rgba(0,0,0,.92);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);border-top:1px solid #1c1c1c;
  }
  .sizebar button{
    flex:1;background:#111;color:var(--fg);border:1px solid #2a2a2a;cursor:pointer;
    border-radius:12px;padding:14px;font-size:22px;font-weight:800;
  }
  .sizebar button:active{background:#222;}
  .sizebar .navbtn{font-size:18px;}

  /* prevent text selection + iOS double-tap zoom on controls */
  .item,.backbtn,.sizebar button{user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  html{touch-action:manipulation;}
  /* sizebar buttons: fixed equal widths so they never shift */
  .sizebar button{flex:1 1 0;min-width:0;}
  /* standalone (home-screen) mode: a touch more top room reclaimed */
  @media (display-mode:standalone){ body{background:#000;} }
  /* install hint banner */
  #installhint{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--accent);color:#000;font-size:14px;font-weight:800;
    padding:12px calc(var(--safe-r) + 14px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 14px);
    display:none;align-items:center;gap:10px;line-height:1.25;
  }
  #installhint.show{display:flex;}
  #installhint button{flex:0 0 auto;background:#000;color:var(--accent);border:none;
    border-radius:8px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;}
</style>
</head>
<body>

<div id="menu" class="screen active">
  <h1>SETLIST</h1>
  <div class="sub">Tape un morceau — accélération / décélération / réaccélération</div>

<div id="installhint">

</div>

const LANG = {
  hu:   ['10-susu-108','13-Elenhatas-122','14-Langyes-138'],
  en:   ['11-dj-118','12-Laktoz-120'],
  turc: ['4-Hac-102'],
  // everything else (non-instru) defaults to French = yellow
};
function langClass(s){
  if(s.instru) return ' instru';
  if(LANG.hu.includes(s.num))   return ' hu';
  if(LANG.en.includes(s.num))   return ' en';
  if(LANG.turc.includes(s.num)) return ' turc';
  return ''; // French = default yellow pill
}
SONGS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='item'+langClass(s);
  b.onclick=()=>openSong(i);
  b.innerHTML='<span class="n">'+(i+1)+'</span>'+
              '<span class="t">'+s.title+(s.instru?' ·':'')+'</span>'+
              '<span class="bpm">'+bpmOf(s.num)+'</span>';
  listEl.appendChild(b);
});

function renderLyrics(s){
  if(s.instru){
    return '<div class="instru-note">'+(s.note||'Pas de paroles')+'</div>';
  }
  let h='<div class="lyrics" style="font-size:'+fontPx+'px">';
  s.lyrics.forEach(line=>{
    if(line===''){h+='<div class="blank"></div>';}
    else if(/^(—|=|\(|×|\*)/.test(line.trim()) || /break|^=+/.test(line)){
      h+='<p class="ln marker">'+escapeHtml(line)+'</p>';
    } else {
      h+='<p class="ln">'+escapeHtml(line)+'</p>';
    }
  });
  h+='</div>';
  return h;
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function openSong(i){
  current=i;
  const s=SONGS[i];
  document.getElementById('s-title').textContent=s.title;
  document.getElementById('s-num').textContent=s.num;
  document.getElementById('s-body').innerHTML=renderLyrics(s);
  menuEl.classList.remove('active');
  songEl.classList.add('active');
  window.scrollTo(0,0);
}
function goMenu(){
  songEl.classList.remove('active');
  menuEl.classList.add('active');
  window.scrollTo(0,0);
}
function navSong(d){
  let n=current+d;
  if(n<0)n=SONGS.length-1;
  if(n>=SONGS.length)n=0;
  openSong(n);
}
function changeSize(d){
  fontPx=Math.max(18,Math.min(56,fontPx+d*3));
  const ly=document.querySelector('.lyrics');
  if(ly)ly.style.fontSize=fontPx+'px';
}
// Fullscreen helper: detect standalone (home-screen) launch
const isStandalone = (window.navigator.standalone===true) ||
  (window.matchMedia && window.matchMedia('(display-mode:standalone)').matches);
if(!isStandalone){ document.getElementById('installhint').classList.add('show'); }
// Block iOS pinch / double-tap zoom so the UI never rescales
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<=300){e.preventDefault();}
  lastTouch=now;
},{passive:false});
// keep screen awake-ish: re-request on visibility
let wakeLock=null;
async function reqWake(){try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reqWake();});
reqWake();
</script>
</body>
